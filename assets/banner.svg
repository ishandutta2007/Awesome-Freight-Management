<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <radialGradient id="centerLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0a0f1d" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGradient); }
    .grid-line { stroke: #38bdf8; stroke-opacity: 0.07; stroke-width: 1; }
    
    /* Dynamic Logistics Flow Animations */
    @keyframes flowLeftToRight {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    
    @keyframes pulseOpacity {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.08); }
    }

    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.7; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }

    @keyframes beaconPulse {
      0% { r: 4; opacity: 1; }
      100% { r: 16; opacity: 0; }
    }

    .flow-line {
      stroke-dasharray: 8 12;
      animation: flowLeftToRight 8s linear infinite;
    }

    .flow-line-reverse {
      stroke-dasharray: 6 10;
      animation: flowLeftToRight 12s linear infinite reverse;
    }

    .pulsing-node {
      animation: pulseOpacity 4s ease-in-out infinite;
      transform-origin: center;
    }

    .particle {
      animation: floatParticle 6s ease-in-out infinite;
    }

    .beacon-wave {
      animation: beaconPulse 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
  </style>

  <!-- Deep Slate Canvas Background -->
  <rect width="1200" height="360" rx="16" class="bg" />

  <!-- Subtle Radial Spotlight in Center -->
  <rect width="1200" height="360" rx="16" fill="url(#centerLight)" />

  <!-- Grid Blueprint Pattern Background -->
  <g class="grid">
    <line x1="100" y1="0" x2="100" y2="360" class="grid-line" />
    <line x1="250" y1="0" x2="250" y2="360" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="360" class="grid-line" />
    <line x1="550" y1="0" x2="550" y2="360" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="360" class="grid-line" />
    <line x1="850" y1="0" x2="850" y2="360" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="360" class="grid-line" />
    <line x1="1150" y1="0" x2="1150" y2="360" class="grid-line" />

    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="220" x2="1200" y2="220" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
  </g>

  <!-- Dynamic Animated Ambient Logistics Route Flows (Background Tier) -->
  <g opacity="0.45">
    <!-- Top Corridors -->
    <path d="M -50 80 Q 300 20 600 80 T 1250 50" fill="none" stroke="#38bdf8" stroke-width="2.5" class="flow-line" />
    <path d="M -50 120 Q 400 170 800 100 T 1250 130" fill="none" stroke="#818cf8" stroke-width="2" class="flow-line-reverse" />
    
    <!-- Bottom Corridors -->
    <path d="M -50 280 Q 250 330 650 270 T 1250 310" fill="none" stroke="#34d399" stroke-width="2.5" class="flow-line" />
    <path d="M -50 240 Q 500 210 900 290 T 1250 240" fill="none" stroke="#c084fc" stroke-width="1.8" class="flow-line-reverse" />

    <!-- Route Nodes & Hub Beacons -->
    <!-- Left Hub -->
    <circle cx="120" cy="100" r="5" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="120" cy="100" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5" class="beacon-wave" />

    <!-- Right Hub -->
    <circle cx="1080" cy="260" r="5" fill="#34d399" filter="url(#softGlow)" />
    <circle cx="1080" cy="260" r="8" fill="none" stroke="#34d399" stroke-width="1.5" class="beacon-wave" />

    <!-- Floating Cargo Particles -->
    <circle cx="180" cy="220" r="3" fill="#38bdf8" class="particle" />
    <circle cx="320" cy="60" r="2.5" fill="#818cf8" class="particle" style="animation-delay: -2s;" />
    <circle cx="880" cy="70" r="3.5" fill="#c084fc" class="particle" style="animation-delay: -4s;" />
    <circle cx="1020" cy="210" r="3" fill="#34d399" class="particle" style="animation-delay: -1.5s;" />
  </g>

  <!-- Central Foreground Content (Title, Subtitle & Domain Badges) -->
  <g id="foreground-content">
    <!-- Category Pill Badge -->
    <g transform="translate(600, 75)">
      <rect x="-185" y="-18" width="370" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
      <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="1.5">
        GLOBAL LOGISTICS &amp; TMS DIRECTORY
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Freight Management
    </text>

    <!-- Title Underline Gradient -->
    <rect x="420" y="185" width="360" height="4" rx="2" fill="url(#primaryGlow)" />

    <!-- Subtitle -->
    <text x="600" y="225" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Curated Enterprise SaaS Platforms &amp; Open-Source TMS Orchestration Engines
    </text>

    <!-- Transport Mode Pills / Metrics Bar in Foreground -->
    <g transform="translate(600, 280)">
      <!-- Ocean -->
      <g transform="translate(-240, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
        <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">🚢 Ocean FCL/LCL</text>
      </g>
      <!-- Road / Trucking -->
      <g transform="translate(-80, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#0f172a" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
        <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">🚛 Road FTL/LTL</text>
      </g>
      <!-- Air Cargo -->
      <g transform="translate(80, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#0f172a" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4" />
        <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">✈️ Air Forwarding</text>
      </g>
      <!-- Intermodal / Rail -->
      <g transform="translate(240, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#0f172a" stroke="#34d399" stroke-width="1" stroke-opacity="0.4" />
        <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">🚆 Multi-Modal TMS</text>
      </g>
    </g>
  </g>
</svg>
